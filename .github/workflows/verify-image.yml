name: Verify published image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact ghcr.io candidate digest or released image to verify
        type: string
        required: true
      exporter_version:
        description: Exporter version included in this image
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/verify-candidate
        with:
          image: ${{ inputs.image }}
          exporter_version: ${{ inputs.exporter_version }}
