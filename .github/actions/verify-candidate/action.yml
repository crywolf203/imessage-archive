name: Verify candidate through Compose
description: Run real image regression tests with isolated synthetic data
inputs:
  image:
    description: Local image or immutable registry image reference
    required: true
  exporter_version:
    description: Expected exporter version from the candidate source
    required: true
  wifi_image:
    description: Optional local wireless sidecar image to verify alongside the app
    required: false
runs:
  using: composite
  steps:
    - name: Validate and start disposable Compose
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        EXPECTED_EXPORTER_VERSION: ${{ inputs.exporter_version }}
        APP_USER: runtime-test
        APP_PASSWORD: disposable-runtime-test-password
        FLASK_SECRET_KEY: disposable-runtime-test-secret
        COMPOSE_FILE: docker-compose.image.yml:tests/compose.ci.yml
        COMPOSE_PROJECT_NAME: imessage-ci
      run: |
        docker compose config --quiet
        docker compose up -d --no-build --wait --wait-timeout 90
        docker compose exec -T imessage-archive python /verification/container_runtime.py
        docker compose cp imessage-archive:/tmp/runtime-check-results.json runtime-check-results.json
        cat runtime-check-results.json >> "$GITHUB_STEP_SUMMARY"
    - name: Test real wireless components with synthetic data
      if: inputs.wifi_image != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        WIFI_IMAGE: ${{ inputs.wifi_image }}
        APP_PASSWORD: disposable-runtime-test-password
        COMPOSE_FILE: docker-compose.image.yml:tests/compose.ci.yml
        COMPOSE_PROJECT_NAME: imessage-ci
      run: |
        source_container=$(docker create "$WIFI_IMAGE")
        trap 'docker rm -f "$source_container" imessage-ci-wifi >/dev/null 2>&1 || true' EXIT
        docker cp "$source_container:/usr/local/bin/netmuxd" ./netmuxd-ci
        docker compose cp ./netmuxd-ci imessage-archive:/tmp/netmuxd-ci
        docker compose exec -T imessage-archive /opt/wifi/bin/pip install --no-cache-dir zeroconf==0.148.0
        docker compose exec -T imessage-archive /opt/wifi/bin/python /verification/wifi_discovery_runtime.py /tmp/netmuxd-ci
        docker run -d --name imessage-ci-wifi --network imessage-ci_default \
          --read-only --cap-drop ALL --security-opt no-new-privileges:true \
          --memory 256m --cpus 1 \
          --mount type=volume,src=imessage-ci_ci-lockdown,dst=/var/lib/lockdown,readonly \
          --mount type=volume,src=imessage-ci_ci-wifi-run,dst=/run/imessage-wifi \
          "$WIFI_IMAGE"
        for attempt in $(seq 1 30); do
          if docker compose exec -T imessage-archive test -S /run/imessage-wifi/usbmuxd.sock; then
            break
          fi
          sleep 1
        done
        docker compose exec -T imessage-archive python -c "import pathlib,stat; p=pathlib.Path('/run/imessage-wifi/usbmuxd.sock'); assert stat.S_ISSOCK(p.stat().st_mode); assert stat.S_IMODE(p.stat().st_mode)==0o600; assert stat.S_IMODE(p.parent.stat().st_mode)==0o700"
        docker compose exec -T -e USBMUXD_SOCKET_ADDRESS=UNIX:/run/imessage-wifi/usbmuxd.sock imessage-archive idevice_id -n
        test "$(docker inspect imessage-ci-wifi --format '{{.State.Running}}')" = true
        docker logs --tail=20 imessage-ci-wifi
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - name: Check browser login, navigation and images
      shell: bash
      env:
        APP_USER: runtime-test
        APP_PASSWORD: disposable-runtime-test-password
      run: |
        python -m pip install playwright
        python -m playwright install --with-deps chromium
        python tests/compose_browser.py
    - name: Disposable container logs
      if: failure()
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        APP_PASSWORD: disposable-runtime-test-password
        COMPOSE_FILE: docker-compose.image.yml:tests/compose.ci.yml
        COMPOSE_PROJECT_NAME: imessage-ci
      run: docker compose logs --tail=100
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: compose-runtime-proof
        path: |
          runtime-check-results.json
          compose-proof/*.png
        retention-days: 30
    - name: Remove only disposable CI volumes
      if: always()
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        APP_PASSWORD: disposable-runtime-test-password
        COMPOSE_FILE: docker-compose.image.yml:tests/compose.ci.yml
        COMPOSE_PROJECT_NAME: imessage-ci
      run: docker compose down --volumes
